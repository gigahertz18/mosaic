name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run gitleaks
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate:
    runs-on: ubuntu-latest
    needs: secret-scan
    env:
      COMPOSE_FILE: -f docker/docker-compose.yml -f docker/docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/Dockerfile', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build application image
        run: make build

      - name: Ruff
        run: make lint

      - name: Black (check only)
        run: make format

      - name: mypy
        run: make typecheck

      - name: DB migration
        run: make migrate-up

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Coverage
        run: make coverage

      - name: Tear down services
        if: always()
        run: docker compose $COMPOSE_FILE --project-directory . down -v
